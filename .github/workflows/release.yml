name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FLUTTER_VERSION: '3.22.0'
  OWNER: owdvertsbot
  REPO: Workout-flutter-app

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Get Version
        id: get-version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}

      - run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Generate Download Page
        run: |
          # Read template and replace version placeholder
          VERSION="${{ steps.get-version.outputs.version }}"
          sed "s/{{VERSION}}/${VERSION#v}/g" .github/release_template.html > docs/index.html
          echo "Generated index.html with version: $VERSION"

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        id: create-release
        with:
          body_path: .github/release_body.md
          draft: true
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

      - name: Upload Download Page Artifact
        uses: actions/upload-artifact@v4
        with:
          name: download-page
          path: docs
          retention-days: 1

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Download Page Artifact
        uses: actions/download-artifact@v4
        with:
          name: download-page
          path: docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment on Release
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.inputs?.version ? undefined : undefined,
              owner: '${{ env.OWNER }}',
              repo: '${{ env.REPO }}',
              body: '🚀 **Download page deployed!**\n\nYour release is now available at: ${{ steps.deployment.outputs.page_url }}'
            })
        continue-on-error: true
