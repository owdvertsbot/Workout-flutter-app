name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        type: string

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get Version
        id: get-version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Draft Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release_body.md
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}
      
      - run: flutter pub get
      
      - name: Build Release APK
        run: flutter build apk --release
      
      - name: Upload Release APK
        uses: softprops/action-gh-release@v2
        with:
          release_name: ${{ needs.release.outputs.version }}
          upload_url: ${{ needs.release.outputs.upload_url }}
          assets_path: build/app/outputs/flutter-apk
          assets: |
            app-release.apk
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}
      
      - run: flutter pub get
      
      - name: Build Debug APK
        run: flutter build apk --debug
      
      - name: Upload Debug APK
        uses: softprops/action-gh-release@v2
        with:
          release_name: ${{ needs.release.outputs.version }}
          upload_url: ${{ needs.release.outputs.upload_url }}
          assets_path: build/app/outputs/flutter-apk
          assets: |
            app-debug.apk
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

  build-ipa:
    name: Build iOS
    runs-on: macos-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}
      
      - run: flutter pub get
      
      - name: Build iOS for Simulator
        run: |
          flutter build ios --simulator --no-codesign
      
      - name: Create Archive
        run: |
          cd build/ios/iphonesimulator
          zip -r rpg-workout-app-${{ needs.release.outputs.version }}-ios.zip Runner.app
      
      - name: Upload iOS Build
        uses: softprops/action-gh-release@v2
        with:
          release_name: ${{ needs.release.outputs.version }}
          upload_url: ${{ needs.release.outputs.upload_url }}
          assets_path: build/ios
          assets: |
            rpg-workout-app-${{ needs.release.outputs.version }}-ios.zip
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
