name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

env:
  FLUTTER_VERSION: '3.22.0'
  OWNER: ${{ github.repository_owner }}
  REPO: ${{ github.event.repository.name }}

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get Version
        id: get-version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
          echo "Display version: ${{ steps.get-version.outputs.version }}"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Android App Bundle (AAB) for Google Play
        run: flutter build appbundle --release

      - name: Prepare Release Assets
        run: |
          # Rename outputs for clarity
          cp build/app/outputs/flutter-apk/app-release.apk app-release.apk
          cp build/app/outputs/flutter-apk/app-debug.apk app-debug.apk
          cp build/app/outputs/bundle/release/app-release.aab app-release.aab
          
          # Get file sizes
          ls -lh *.apk *.aab

      - name: Generate Release Body
        id: release-body
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          cat > release_body.md << 'RELEASE_EOF'
          ## Download

          - **Release APK**: `app-release.apk` - Optimized for production (~59 MB)
          - **Debug APK**: `app-debug.apk` - For testing (~160 MB)
          - **App Bundle**: `app-release.aab` - For Google Play Store

          ## Installation

          ### Android
          1. Download the APK file
          2. Enable "Install from unknown sources" in Settings
          3. Open the APK to install

          ### Google Play
          The App Bundle (AAB) is ready for Google Play Store submission.

          ## What's New

          See the full changelog on the [releases page](https://github.com/${{ env.OWNER }}/${{ env.REPO }}/releases).
          RELEASE_EOF
          echo "Generated release body"

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        id: create-release
        with:
          body_path: release_body.md
          draft: false
          generate_release_notes: true
          files: |
            app-release.apk
            app-debug.apk
            app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Download Page Artifact
        uses: actions/upload-artifact@v4
        with:
          name: download-page
          path: docs
          retention-days: 1

      - name: Print Summary
        run: |
          echo "## Release Summary"
          echo "- Version: ${{ steps.get-version.outputs.version }}"
          echo "- Release URL: ${{ steps.create-release.outputs.url }}"
          echo "- Assets uploaded: app-release.apk, app-debug.apk, app-release.aab"

  generate-download-page:
    name: Generate Download Page
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests || true

      - name: Generate Download Page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
          OUTPUT_PATH: docs/index.html
          GITHUB_REPOSITORY_OWNER: ${{ env.OWNER }}
          GITHUB_REPOSITORY_NAME: ${{ env.REPO }}
        run: |
          python .github/scripts/generate_release_page.py || echo "Using fallback template"
          
          # Fallback: Use template if script fails
          if [ ! -f docs/index.html ]; then
            VERSION="${{ needs.build-release.outputs.version }}"
            sed "s/{{VERSION}}/${VERSION#v}/g" .github/release_template.html > docs/index.html
          fi

      - name: Upload Download Page Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-download-page
          path: docs
          retention-days: 1

  deploy-pages:
    name: Deploy GitHub Pages
    needs: [build-release, generate-download-page]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Generated Page
        uses: actions/download-artifact@v4
        with:
          name: generated-download-page
          path: docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print Deployment Summary
        run: |
          echo "## Deployment Summary"
          echo "- Download page URL: ${{ steps.deployment.outputs.page_url }}"
          echo "- Repository: ${{ env.OWNER }}/${{ env.REPO }}"
          echo ""
          echo "The download page is now live with all historical releases!"
