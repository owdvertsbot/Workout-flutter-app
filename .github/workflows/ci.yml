name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
          cache-key: flutter-3.44.8
      
      - run: flutter pub get
      
      - name: Run flutter analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true
          echo "--- Flutter analyze output ---"
          cat analyze.log
          echo "--- End of analyze output ---"
      
      - name: Upload analyze log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-analyze-log
          path: analyze.log
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
          cache-key: flutter-3.44.8
      
      - run: flutter pub get
      
      - name: Run tests
        run: flutter test || true
