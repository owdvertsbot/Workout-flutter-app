name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true
          cache-key: flutter-3.27.0
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs
      
      - name: Run flutter analyze
        run: |
          echo "--- Running flutter analyze ---"
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "--- Flutter analyze exit code: $EXIT_CODE ---"
          cat analyze.log
          exit $EXIT_CODE
      
      - name: Upload analyze log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-analyze-log
          path: analyze.log
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true
          cache-key: flutter-3.27.0
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs
      
      - name: Run tests
        run: |
          echo "--- Running flutter test ---"
          set -o pipefail
          flutter test 2>&1 | tee test.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "--- Test exit code: $EXIT_CODE ---"
          exit $EXIT_CODE
